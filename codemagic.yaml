workflows:
  ios-app-store:
    name: Copper App iOS (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Code Magic API Key Admin"
    environment:
      node: latest
      ruby: 3.2.2
      groups:
        # Debe contener CERTIFICATE_PRIVATE_KEY (clave privada del certificado de distribución)
        - appstore_credentials
      vars:
        # Identificador del paquete de la aplicación
        APP_ID: "com.copper.residents"
        # Nombre de la aplicación (usado para localizar el workspace nativo generado por Expo)
        XCODE_WORKSPACE: "apps/mobile-residents/ios/CopperApp.xcworkspace"
        XCODE_SCHEME: "CopperApp"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Install pnpm
        script: |
          if ! command -v pnpm &> /dev/null; then
            npm install -g pnpm
          else
            echo "pnpm ya está instalado en la máquina, omitiendo instalación."
          fi
      - name: Install dependencies
        script: |
          pnpm install --frozen-lockfile
      - name: Expo Prebuild (iOS)
        script: |
          cd apps/mobile-residents
          npx expo prebuild --platform ios --clean
      - name: Patch Podfile (fmt / clang 17+)
        script: |
          # fmt 11.0.2 (pineado por React Native 0.76.9) no compila con clang 17+
          # (Xcode 16.3 en adelante): la validación consteval de format strings hace
          # aritmética de punteros que ya no cuenta como expresión constante.
          # FMT_USE_CONSTEVAL=0 la desactiva y la deja en runtime; base.h lo protege
          # con #ifndef precisamente para esto.
          # Va aquí y no en el repo porque expo prebuild --clean regenera el Podfile.
          python3 - <<'PY'
          import sys, pathlib

          podfile = pathlib.Path("apps/mobile-residents/ios/Podfile")
          source = podfile.read_text()
          anchor = "post_install do |installer|"

          if anchor not in source:
              sys.exit(f"No se encontró '{anchor}' en el Podfile; revisar plantilla de Expo.")

          patch = """
              installer.pods_project.targets.each do |pod_target|
                pod_target.build_configurations.each do |build_config|
                  defs = build_config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] || ['$(inherited)']
                  defs = [defs] if defs.is_a?(String)
                  defs << 'FMT_USE_CONSTEVAL=0' unless defs.include?('FMT_USE_CONSTEVAL=0')
                  build_config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] = defs
                end
              end
          """

          podfile.write_text(source.replace(anchor, anchor + patch, 1))
          print("Podfile parcheado: FMT_USE_CONSTEVAL=0")
          PY
      - name: Install Pods
        script: |
          cd apps/mobile-residents/ios
          pod install
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch Apple Certificates and Profiles
        script: |
          # Descarga los certificados de distribución y perfiles correspondientes desde App Store Connect usando la integración de Codemagic
          # La clave privada es obligatoria: el Developer Portal solo guarda la parte
          # pública del certificado, sin ella no se puede armar el .p12 firmable.
          app-store-connect fetch-signing-files "$APP_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

          # La extensión de notificaciones de OneSignal es un target aparte con su
          # propio bundle ID: necesita su propio perfil o el archive falla al firmarla.
          app-store-connect fetch-signing-files "$APP_ID.OneSignalNotificationServiceExtension" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Apply Provisioning Profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          # Incrementa el build number si es necesario (Codemagic incrementa automáticamente $BUILD_NUMBER)
          cd apps/mobile-residents/ios
          agvtool new-version -all $BUILD_NUMBER
          
          # Compilar el archivo IPA usando la herramienta de Codemagic
          cd ../../..
          # --disable-xcpretty: xcpretty no está instalado en Ruby 3.2.2 (el downgrade
          # necesario para CocoaPods), y su ausencia rompe el pipe y oculta los
          # errores reales de xcodebuild.
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
