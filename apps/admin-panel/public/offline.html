<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8A1C14">
  <title>Sin conexión · Copper</title>
  <!-- Autocontenida a propósito: sin red no hay bundle de Next ni estilos que cargar. -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; box-sizing: border-box; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #ffffff; color: #18181b;
    }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #71717a; margin: 0 0 24px; }
    button {
      font: inherit; font-size: 14px; font-weight: 600; color: #ffffff; background: #8A1C14;
      border: 0; border-radius: 12px; padding: 10px 20px; cursor: pointer;
    }
    button:hover { background: #a1231a; }
    @media (prefers-color-scheme: dark) {
      body { background: #020617; color: #f1f5f9; }
      p { color: #a1a1aa; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Copper">
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. El panel necesita red para mostrar la información de tu conjunto.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
