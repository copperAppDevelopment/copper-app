workflows:
  ios-app-store:
    name: Copper App iOS (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Code Magic API Key Admin"
    environment:
      node: latest
      ruby: 3.2.2
      groups:
        # Debe contener CERTIFICATE_PRIVATE_KEY (clave privada del certificado de distribución)
        - appstore_credentials
        # Variables EXPO_PUBLIC_* que Expo inyecta en el bundle de JS
        - copper_mobile_env
      vars:
        # Identificador del paquete de la aplicación
        APP_ID: "com.copper.residents"
        # Nombre de la aplicación (usado para localizar el workspace nativo generado por Expo)
        XCODE_WORKSPACE: "apps/mobile-residents/ios/CopperApp.xcworkspace"
        XCODE_SCHEME: "CopperApp"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Install pnpm
        script: |
          if ! command -v pnpm &> /dev/null; then
            npm install -g pnpm
          else
            echo "pnpm ya está instalado en la máquina, omitiendo instalación."
          fi
      - name: Install dependencies
        script: |
          pnpm install --frozen-lockfile
      - name: Check required env vars
        script: |
          # El código usa `process.env.X || '<valor de desarrollo>'`, así que una
          # variable ausente no rompe el build: produce un bundle que apunta a la
          # IP local del desarrollador. Mejor fallar aquí y en voz alta.
          missing=""
          for var in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY \
                     EXPO_PUBLIC_API_URL EXPO_PUBLIC_ONESIGNAL_APP_ID; do
            eval "value=\$$var"
            if [ -z "$value" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Faltan variables del grupo copper_mobile_env:$missing"
            exit 1
          fi
          echo "Todas las variables EXPO_PUBLIC_* están presentes."
      - name: Expo Prebuild (iOS)
        script: |
          cd apps/mobile-residents
          npx expo prebuild --platform ios --clean
      - name: Install Pods
        script: |
          cd apps/mobile-residents/ios
          pod install
      - name: Patch fmt (clang 17+)
        script: |
          # fmt 11.0.2 (pineado por React Native 0.76.9) no compila con clang 17+
          # (Xcode 16.3 en adelante): la validación consteval de format strings hace
          # aritmética de punteros que ya no cuenta como expresión constante.
          #
          # No sirve pasar -DFMT_USE_CONSTEVAL=0: la cadena en base.h es un #if, no
          # un #ifndef, así que la cabecera pisa cualquier define externo. Hay que
          # forzar la primera rama para que gane. La validación pasa a runtime.
          #
          # Va aquí y no en el repo porque Pods/ lo regenera pod install.
          python3 - <<'PY'
          import pathlib, re, stat, sys

          header = pathlib.Path("apps/mobile-residents/ios/Pods/fmt/include/fmt/base.h")
          source = header.read_text(encoding="utf-8")

          pattern = re.compile(
              r"#if !defined\(__cpp_lib_is_constant_evaluated\)(\s*\n\s*#\s*define FMT_USE_CONSTEVAL 0)"
          )
          patched, n = pattern.subn(r"#if 1  /* CI: consteval roto con clang 17+ */\1", source, count=1)

          if n != 1:
              sys.exit("No se encontró la cadena FMT_USE_CONSTEVAL en base.h; revisar versión de fmt.")

          # CocoaPods deja los fuentes descargados en solo lectura (0444).
          header.chmod(header.stat().st_mode | stat.S_IWUSR)
          header.write_text(patched, encoding="utf-8")
          print("fmt/base.h parcheado: FMT_USE_CONSTEVAL forzado a 0")
          PY
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch Apple Certificates and Profiles
        script: |
          # Descarga los certificados de distribución y perfiles correspondientes desde App Store Connect usando la integración de Codemagic
          # La clave privada es obligatoria: el Developer Portal solo guarda la parte
          # pública del certificado, sin ella no se puede armar el .p12 firmable.
          app-store-connect fetch-signing-files "$APP_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

          # La extensión de notificaciones de OneSignal es un target aparte con su
          # propio bundle ID: necesita su propio perfil o el archive falla al firmarla.
          app-store-connect fetch-signing-files "$APP_ID.OneSignalNotificationServiceExtension" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Apply Provisioning Profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          # Incrementa el build number si es necesario (Codemagic incrementa automáticamente $BUILD_NUMBER)
          cd apps/mobile-residents/ios
          agvtool new-version -all $BUILD_NUMBER
          
          # Compilar el archivo IPA usando la herramienta de Codemagic
          cd ../../..
          # --disable-xcpretty: xcpretty no está instalado en Ruby 3.2.2 (el downgrade
          # necesario para CocoaPods), y su ausencia rompe el pipe y oculta los
          # errores reales de xcodebuild.
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
